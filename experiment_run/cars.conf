# cars.conf -- single source of truth for the manual-drive rig (sourced by exp.sh).
# Edit CAR_IPS if DHCP reassigns them; run  ./exp.sh scan  to list reachable nvidia@ hosts.

SERVER_IP="192.168.8.30"                    # this control laptop (CURE server, ROS_DOMAIN_ID 0)
ROBOT_IDS="1,2,7,8"                          # CURE robot IDs for the server launch
ROBOT_POSES="0,0,0;0,0.7,0;0,1.4,0;0,2.1,0"  # initial global placements; 0.7 m row spacing (physical)

# Active cars. Index order 0,1,2,3 is also the gate phase order and the robot<idx>/bag label.
# car8 (192.168.8.28, Intel NUC) has a livox time-sync quirk that can flood scan-drops under heavy
# load; manual mode is lighter (no explorer), so it is included -- watch its scan-drop log.
CAR_NAMES=(car1 car2 car7 car8)
CAR_IPS=(192.168.8.49 192.168.8.43 192.168.8.141 192.168.8.28)
CAR_VIDS=(1 2 7 8)
CAR_DOMAINS=(1 2 7 8)
CAR_WSES=(/home/nvidia/SenBettle_latest /home/nvidia/SenseBeetle /home/nvidia/SenseBeetle /home/nvidia/SenseBeetle)
# 1 = wait for this car to localize before the "start driving" prompt; 0 = record it but don't wait.
# car8 (NUC) can't localize (FAST-LIO lag) but is still recorded as the 4th scheduled broadcaster.
CAR_WAIT=(1 1 1 0)
